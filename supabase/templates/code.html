<!DOCTYPE html>
<!--
  sumptus — the sign-in code, in the app's own voice.

  Paste this into BOTH templates under Authentication → Email Templates:

    Magic Link      — used when the address already has an account
    Confirm signup  — used the first time an address is seen

  signInWithOtp picks between them by whether the user exists, so changing only
  one leaves exactly one flow broken: the very first sign-in, which is the one
  nobody tests twice.

  Written for mail clients, not browsers. A whole document rather than a
  fragment, because without the viewport meta a phone lays the mail out at
  980px and then zooms out — the code is the one thing here that must be
  readable without pinching. Tables rather than flex, every style inline, no web
  font: Coterie cannot be loaded here, so the display face falls back to
  Georgia, which is close enough in the one place it appears.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Your sumptus code</title>
</head>
<body style="margin:0;padding:0;background:#ffffff">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#ffffff;margin:0;padding:0">
  <tr>
    <td align="center" style="padding:40px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:440px;text-align:left">

        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:17px;
                     letter-spacing:-0.01em;color:#111111;padding-bottom:28px">
            sumptus
          </td>
        </tr>

        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:26px;
                     line-height:1.25;letter-spacing:-0.015em;color:#111111;padding-bottom:10px">
            Your code
          </td>
        </tr>

        <tr>
          <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                     font-size:14px;line-height:1.6;color:#777777;padding-bottom:24px">
            Type these six digits into the app to finish signing in.
          </td>
        </tr>

        <tr>
          <td align="center"
              style="background:#f6f6f4;border:1px solid #e8e8e5;border-radius:10px;padding:22px 12px">
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:34px;
                         letter-spacing:0.16em;color:#111111;white-space:nowrap">{{ .Token }}</span>
          </td>
        </tr>

        <tr>
          <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                     font-size:14px;line-height:1.6;color:#777777;padding:24px 0 20px">
            It stops working in an hour. Asking for a new one is always fine.
          </td>
        </tr>

        <tr>
          <td style="border-top:1px solid #e8e8e5;padding-top:20px;
                     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
                     font-size:13px;line-height:1.6;color:#777777">
            If you didn&rsquo;t ask for this, nothing has happened and you can ignore it.
            The code alone cannot do anything without your email address.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
